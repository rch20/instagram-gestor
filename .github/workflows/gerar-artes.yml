name: Gerar artes

# Transforma artes/<pasta>/arte.json em JPEGs prontos para o Instagram e salva no repositório.
# Não publica nada.
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta da arte (ex.: artes/2026-10-27_dicas-whatsapp)"
        required: true

permissions:
  contents: write

concurrency:
  group: gerar-artes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Validar pasta
        env:
          PASTA: ${{ inputs.pasta }}
        run: |
          case "$PASTA" in artes/*) ;; *) echo "::error::A pasta precisa estar dentro de artes/"; exit 1;; esac
          case "$PASTA" in *..*) echo "::error::Caminho inválido"; exit 1;; esac
          { [ -f "$PASTA/arte.json" ] || ls "$PASTA"/*.html >/dev/null 2>&1; } || { echo "::error::Não achei arte.json nem .html em $PASTA"; exit 1; }
      - name: Gerar
        env:
          PASTA: ${{ inputs.pasta }}
        run: |
          if [ -f "$PASTA/arte.json" ]; then node ferramentas/artes/render.js "$PASTA"; fi
          if grep -q '"formato": *"reel"' "$PASTA/arte.json" 2>/dev/null; then
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
            python3 ferramentas/artes/montar-reel.py "$PASTA"
          fi
          if ls "$PASTA"/*.html >/dev/null 2>&1; then node ferramentas/artes/render-html.js "$PASTA"; fi
      - name: Salvar
        env:
          PASTA: ${{ inputs.pasta }}
        run: |
          git config user.name "gerar-artes"
          git config user.email "actions@users.noreply.github.com"
          git add "$PASTA"/*.jpg; git add "$PASTA"/*.mp4 2>/dev/null || true
          git diff --cached --quiet && { echo "Nada novo."; exit 0; }
          git commit -m "Artes geradas: $PASTA"
          git pull --rebase
          git push
