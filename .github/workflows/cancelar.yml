name: Cancelar agendamento

# Tira da Publora uma publicação ainda agendada (nunca uma publicada). O item volta para "aprovado".
on:
  workflow_dispatch:
    inputs:
      id:
        description: "id da publicação em dados/publicacoes.json"
        required: true
      motivo:
        description: "Por que está sendo cancelada"
        required: true

permissions:
  contents: write

concurrency:
  group: agendar-publicacoes
  cancel-in-progress: false

jobs:
  cancelar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r ferramentas/instagram-skills/requirements.txt
      - name: Cancelar
        env:
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          ID: ${{ inputs.id }}
          MOTIVO: ${{ inputs.motivo }}
        run: python ferramentas/cancelar.py "$ID" "$MOTIVO"
      - name: Salvar estado
        run: |
          git config user.name "cancelar"
          git config user.email "actions@users.noreply.github.com"
          git add dados/publicacoes.json
          git diff --cached --quiet && exit 0
          git commit -m "Agendamento cancelado: ${{ inputs.id }}"
          git pull --rebase && git push
