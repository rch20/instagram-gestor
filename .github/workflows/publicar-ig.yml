name: Publicar direto no Instagram (API oficial)

# Publica AGORA um item aprovado, sem a Publora. Use id "testar" para só conferir a chave.
# Precisa do secret META_IG_TOKEN (app da Meta, etapa 4 das pendências).
on:
  workflow_dispatch:
    inputs:
      id:
        description: "id da publicação em dados/publicacoes.json (ou 'testar')"
        required: true

permissions:
  contents: write

concurrency:
  group: agendar-publicacoes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Publicar
        shell: bash
        env:
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          ID: ${{ inputs.id }}
        run: python ferramentas/publicar_ig.py "$ID" | tee resultado.txt
      - name: Mostrar resultado
        if: always()
        run: test -f resultado.txt && while IFS= read -r l; do echo "::notice::$l"; done < resultado.txt || true
      - name: Salvar estado
        if: always() && inputs.id != 'testar'
        env:
          ID: ${{ inputs.id }}
        run: |
          git config user.name "publicar-ig"
          git config user.email "actions@users.noreply.github.com"
          git add dados/publicacoes.json registro/erros.md
          git diff --cached --quiet && exit 0
          git commit -m "Publicação direta no Instagram: $ID"
          git pull --rebase && git push
