name: Publicar direto no Instagram (API oficial)

# Publica um item aprovado direto no Instagram, sem a Publora. Use id "testar" para só conferir a chave.
# Roda sozinho ("devidos"): pega o item "canal": "api" até 4 h antes, espera a hora e publica (respeita a pausa).
# O agendamento do GitHub atrasa horas; por isso a execução espera em vez de depender da hora exata.
# Precisa do secret META_IG_TOKEN (usuário do sistema "Publicador").
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "id da publicação em dados/publicacoes.json (ou 'testar')"
        required: true

permissions:
  contents: write

concurrency:
  group: agendar-publicacoes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Publicar
        shell: bash
        env:
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          ID: ${{ inputs.id }}
        run: set -o pipefail; python ferramentas/publicar_ig.py "${ID:-devidos}" | tee resultado.txt
      - name: Mostrar resultado
        if: always()
        run: test -f resultado.txt && while IFS= read -r l; do echo "::notice::$l"; done < resultado.txt || true
      - name: Salvar estado
        if: always() && inputs.id != 'testar'
        env:
          ID: ${{ inputs.id }}
        run: |
          git config user.name "publicar-ig"
          git config user.email "actions@users.noreply.github.com"
          git add dados/publicacoes.json registro/erros.md
          git diff --cached --quiet && exit 0
          git commit -m "Publicação direta no Instagram: ${ID:-devidos}"
          git pull --rebase && git push
